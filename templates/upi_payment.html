<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Payment - TurfBooking</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 500px;
            margin: 80px auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .section-title {
            color: #333;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .payment-button {
            background-color: #2575fc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        .payment-button:hover {
            background-color: #1b5cc5;
        }
        .upi-app-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        .upi-app-buttons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 120px;
            height: 50px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            text-decoration: none;
            padding: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .upi-app-buttons a:hover {
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .upi-app-buttons img {
            width: 80px;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>UPI Payment</h1>
        
        <!-- Approach 1: Manual UPI ID Entry -->
        <form action="{{ url_for('main.process_upi_payment', booking_id=booking_id) }}" method="POST">
            <div class="form-group">
                <label for="upi_id">Enter your UPI ID:</label>
                <input type="text" id="upi_id" name="upi_id" placeholder="user@upi" required>
            </div>
            <button type="submit" class="payment-button">Pay Now</button>
        </form>
        
        <hr>
        
        <!-- Approach 2: Select UPI App for Payment -->
        <h2 class="section-title">Or Select a UPI App</h2>
        <div class="upi-app-buttons">
            <a href="{{ url_for('main.gpay', booking_id=booking_id) }}">
                <img src="{{ url_for('static', filename='images/google-pay-logo.svg') }}" alt="GPAY" class="property-image">
            </a>
            
            
            
            <a href="{{ url_for('main.phonepe', booking_id=booking_id) }}">
                <img src="{{ url_for('static', filename='images/phonepe.svg') }}" alt="PHONEPE" class="property-image">
            </a>
            
            <a href="{{ url_for('main.paytm', booking_id=booking_id) }}"> 
                <img src="https://assetscdn1.paytm.com/images/catalog/category/5165/paytm_logo.png" alt="Paytm">
            </a>

           <a href="{{ url_for('main.bhim', booking_id=booking_id) }}"> 
                <img src="{{ url_for('static', filename='images/bhim.svg') }}" alt="BHIMe" class="property-image">
            </a>
        </div>
    </div>
</body>
</html>
