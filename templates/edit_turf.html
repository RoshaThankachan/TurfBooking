<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Turf</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #6a11cb;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-group textarea {
            resize: vertical;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            background-color: #2575fc;
            text-align: center;
            cursor: pointer;
        }
        .btn-cancel {
            background-color: #ff4d4d;
            margin-left: 10px;
        }
        .turf-image-preview {
            margin-top: 10px;
            max-width: 100px;
            height: auto;
            border-radius: 5px;
            margin-right: 10px;
        }
        .image-preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .image-preview-item {
            position: relative;
            margin-bottom: 15px;
        }
        .remove-image {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: red;
            color: white;
            font-weight: bold;
            text-align: center;
            line-height: 24px;
            cursor: pointer;
        }
        .time-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            text-transform: uppercase;
            text-align: center;
            background-color: #f9f9f9;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }
        .time-input:focus {
            border-color: #6a11cb;
            box-shadow: 0 0 5px rgba(106, 17, 203, 0.5);
            background-color: #ffffff;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Edit Turf</h1>
        <form action="{{ url_for('owner.edit_turf', turf_id=turf.turf_id) }}" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="turf_name">Turf Name:</label>
                <input type="text" id="turf_name" name="turf_name" value="{{ turf.turf_name }}" required>
            </div>
            <div class="form-group">
                <label for="turf_phno">Phone Number:</label>
                <input type="text" id="turf_phno" name="turf_phno" value="{{ turf.turf_phno }}" required>
            </div>
            <div class="form-group">
                <label for="turf_address">Address:</label>
                <input type="text" id="turf_address" name="turf_address" value="{{ turf.turf_address }}" required>
            </div>
            <div class="form-group">
                <label for="turf_street">Street:</label>
                <input type="text" id="turf_street" name="turf_street" value="{{ turf.turf_street }}" required>
            </div>
            <div class="form-group">
                <label for="turf_dist">District:</label>
                <input type="text" id="turf_dist" name="turf_dist" value="{{ turf.turf_dist }}" required>
            </div>
            <div class="form-group">
                <label for="turf_pin">PIN Code:</label>
                <input type="text" id="turf_pin" name="turf_pin" value="{{ turf.turf_pin }}" required>
            </div>
            <div class="form-group">
                <label for="price_per_hour">Price per Hour:</label>
                <input type="number" step="0.01" id="price_per_hour" name="price_per_hour" value="{{ turf.price_per_hour }}" required>
            </div>
            <div class="form-group">
                <label for="turf_opening_time">Opening Time:</label>
                <input type="text" id="turf_opening_time" name="turf_opening_time" value="{{ turf.turf_opening_time.strftime('%I:%M %p') }}" required>
            </div>
            <div class="form-group">
                <label for="turf_closing_time">Closing Time:</label>
                <input type="text" id="turf_closing_time" name="turf_closing_time" value="{{ turf.turf_closing_time.strftime('%I:%M %p') }}" required>
            </div>
            
            
            <div class="form-group">
                <label for="turf_desc">Description:</label>
                <textarea id="turf_desc" name="turf_desc" rows="4">{{ turf.turf_desc }}</textarea>
            </div>
            <div class="form-group">
                <label for="category_id">Category:</label>
                <select id="category_id" name="cat_id[]" required>
                    {% for category in categories %}
                        <option value="{{ category.cat_id }}"
                                {% for cat in turf.categories %}
                                    {% if category.cat_id == cat.cat_id %}
                                        selected
                                    {% endif %}
                                {% endfor %}
                        >{{ category.cat_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="subcategory_id">Subcategory:</label>
                <select id="subcategory_id" name="sub_id[]" required>
                    {% for subcategory in subcategories %}
                        <option value="{{ subcategory.sub_id }}"
                                {% for sub in turf.subcategories %}
                                    {% if subcategory.sub_id == sub.sub_id %}
                                        selected
                                    {% endif %}
                                {% endfor %}
                        >{{ subcategory.sub_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="turf_images">Turf Images:</label>
                <input type="file" id="turf_images" name="turf_images" multiple accept=".jpg,.jpeg,.png">
                {% if existing_images %}
                    <div class="form-group">
                        <input type="checkbox" id="keep_existing_images" name="keep_existing_images" checked>
                        <label for="keep_existing_images">Keep existing images</label>
                    </div>
                    <div class="image-preview-container">
                        {% for image in existing_images %}
                            <div class="image-preview-item">
                                <img src="data:image/jpeg;base64,{{ image.image }}" alt="Turf Image" class="turf-image-preview">
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            </div>
            <div class="form-group">
                <button type="submit" class="btn">Save Changes</button>
                <a href="{{ url_for('owner.view_turfs') }}" class="btn btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            function formatTimeInput(inputId) {
                let input = document.getElementById(inputId);
                if (input) {
                    let timeValue = input.value;
                    if (timeValue) {
                        let [hours, minutes] = timeValue.split(':');
                        let period = "AM";
                        hours = parseInt(hours, 10);
                        if (hours >= 12) {
                            period = "PM";
                            if (hours > 12) {
                                hours -= 12;
                            }
                        } else if (hours === 0) {
                            hours = 12;
                        }
                        input.value = `${String(hours).padStart(2, '0')}:${minutes} ${period}`;
                    }
                }
            }
        
            formatTimeInput("turf_opening_time");
            formatTimeInput("turf_closing_time");
        });
        </script>
        
</body>
</html>
