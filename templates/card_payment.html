<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Payment - TurfBooking</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .section-title {
            color: #333;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 14px;
        }
        
        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            background-color: #f0f0f0;
            font-size: 16px;
            color: #333;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus, 
        .form-group select:focus {
            outline: none;
            background-color: #e8e8e8;
            box-shadow: 0 0 0 2px rgba(37, 117, 252, 0.2);
        }
        
        .payment-button {
            background-color: #2575fc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        .payment-button:hover {
            background-color: #1b5cc5;
        }
        .card-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .card-logos img {
            height: 30px;
            object-fit: contain;
        }
            
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-weight: 500;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <h1>Card Payment</h1>
        <div class="card-logos">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Visa_Inc._logo.svg/2560px-Visa_Inc._logo.svg.png" alt="Visa Logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Mastercard-logo.svg/1280px-Mastercard-logo.svg.png" alt="Mastercard Logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/American_Express_logo_%282018%29.svg/1200px-American_Express_logo_%282018%29.svg.png" alt="American Express Logo">
        </div>
        
        <form action="{{ url_for('main.process_card_payment', booking_id=booking_id) }}" method="POST">
            <input type="hidden" name="booking_id" value="{{ booking_id }}">
            <div class="form-group">
                <label for="card_number">Card Number:</label>
                <input type="text" id="card_number" name="card_number" maxlength="16" pattern="\d{16}" placeholder="0000 0000 0000 0000" required>
            </div>
            <div class="form-group">
                <label for="card_holder_name">Card Holder Name:</label>
                <input type="text" id="card_holder_name" name="card_holder_name"  placeholder="Full Name on Card" required>
            </div>
          
            <div class="form-group">
                <label for="expiry_date">Expiry Date:</label>
                <input type="text" id="expiry_date" name="expiry_date" placeholder="MM/YY" pattern="(0[1-9]|1[0-2])\/([0-9]{2})" required>
            </div>
            <div class="form-group">
                <label for="cvv">CVV:</label>
                <input type="text" id="cvv" name="cvv" maxlength="3" pattern="\d{3}" placeholder="000"  required>
            </div>
            <div class="form-group">
                <label for="bank_name">Bank Name:</label>
                <input type="text" id="bank_name" name="bank_name" placeholder="Enter Bank Name"required>
            </div>
            <div class="form-group">
                <label for="card_type">Card Type:</label>
                <select id="card_type" name="card_type" required>
                    <option value="credit">Credit</option>
                    <option value="debit">Debit</option>
                </select>
            </div>
            <button type="submit" class="payment-button">Pay Now</button>
        </form>
    </div>
</body>
</html>
