<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <!-- Include Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Optional: Include simple animation library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        
        .floating-path {
            animation: float 20s ease-in-out infinite;
            opacity: 0.2;
        }
        
        .animate-letter {
            display: inline-block;
            opacity: 0;
            transform: translateY(0);
            animation: fadeIn 0.5s forwards;
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes footballSlide {
            0% { 
                transform: translateX(-250px) rotate(0deg); 
                opacity: 0;
            }
            10% { 
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% { 
                transform: translateX(250px) rotate(360deg); 
                opacity: 0;
            }
        }
        
        .football {
            animation: footballSlide 2s ease-in-out forwards;
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex items-center justify-center overflow-hidden bg-white dark:bg-neutral-950">
    <!-- Background Paths -->
    <div class="absolute inset-0 pointer-events-none">
        <svg class="w-full h-full text-slate-950 dark:text-white" viewBox="0 0 696 316" fill="none">
            <title>Background Paths</title>
            <!-- Simplified paths for performance -->
            <path class="floating-path" d="M-380 -189 C-380 -189 -312 216 152 343 C616 470 684 875 684 875" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.1"></path>
            <path class="floating-path" style="animation-delay: -5s;" d="M-330 -139 C-330 -139 -262 266 202 393 C666 520 734 925 734 925" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"></path>
            <path class="floating-path" style="animation-delay: -10s;" d="M-280 -89 C-280 -89 -212 316 252 443 C716 570 784 975 784 975" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.3"></path>
        </svg>
    </div>

    <!-- Content -->
    <div class="relative z-10 container mx-auto px-4 md:px-6 text-center">
        <div class="max-w-4xl mx-auto animate__animated animate__fadeIn">
            <!-- Increased the height to ensure descenders like 'g' have enough space -->
            <h1 class="text-5xl sm:text-7xl md:text-8xl font-bold mb-8 tracking-tighter relative h-32">
                <!-- Football animation in same line as text -->
                <svg id="football" class="football w-16 h-16 absolute left-1/2 top-1/3 transform -translate-y-1/2" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Modern football -->
                    <circle cx="32" cy="32" r="30" fill="#111111" />
                    <!-- White panels -->
                    <path d="M32 2 C18 2 6 14 6 28 C6 42 18 54 32 54 C46 54 58 42 58 28 C58 14 46 2 32 2 Z" fill="white" />
                    <!-- Black pentagons -->
                    <path d="M32 8 L40 16 L36 28 L28 28 L24 16 Z" fill="#111111" />
                    <path d="M14 18 L24 16 L28 28 L20 36 L10 30 Z" fill="#111111" />
                    <path d="M50 18 L40 16 L36 28 L44 36 L54 30 Z" fill="#111111" />
                    <path d="M10 30 L20 36 L18 48 L8 46 L4 34 Z" fill="#111111" />
                    <path d="M54 30 L44 36 L46 48 L56 46 L60 34 Z" fill="#111111" />
                    <path d="M18 48 L28 48 L32 60 L20 58 L12 50 Z" fill="#111111" />
                    <path d="M46 48 L36 48 L32 60 L44 58 L52 50 Z" fill="#111111" />
                </svg>
                
                <!-- Hidden until football animation completes -->
                <span class="inline-block mr-4 opacity-0 leading-tight" id="titleText">
                    <!-- The title will be inserted here by JavaScript -->
                </span>
            </h1>

            <div class="inline-block group relative bg-gradient-to-b from-black/10 to-white/10 
                dark:from-white/10 dark:to-black/10 p-px rounded-2xl backdrop-blur-lg 
                overflow-hidden shadow-lg hover:shadow-xl transition-shadow duration-300">
                <a href="{{ url_for('main.home') }}" class="inline-block rounded-[1.15rem] px-8 py-6 text-lg font-semibold backdrop-blur-md 
                    bg-white/95 hover:bg-white/100 dark:bg-black/95 dark:hover:bg-black/100 
                    text-black dark:text-white transition-all duration-300 
                    group-hover:-translate-y-0.5 border border-black/10 dark:border-white/10
                    hover:shadow-md dark:hover:shadow-neutral-800/50">
                    <span class="opacity-90 group-hover:opacity-100 transition-opacity">Book Your Field Now</span>
                    <span class="ml-3 opacity-70 group-hover:opacity-100 group-hover:translate-x-1.5 
                        transition-all duration-300">→</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        // Title animation after football animation completes
        setTimeout(() => {
            const titleElement = document.getElementById('titleText');
            titleElement.style.opacity = "1"; // Make the container visible
            
            const title = "TurfBooking";
            
            // Create a container div to ensure proper line height and spacing
            const containerDiv = document.createElement('div');
            containerDiv.className = 'inline-block'; // Keep it inline
            
            title.split('').forEach((letter, index) => {
                const letterSpan = document.createElement('span');
                letterSpan.className = 'animate-letter inline-block text-transparent bg-clip-text bg-gradient-to-r from-neutral-900 to-neutral-700/80 dark:from-white dark:to-white/80';
                letterSpan.style.animationDelay = `${index * 0.1}s`;
                letterSpan.textContent = letter;
                containerDiv.appendChild(letterSpan);
            });
            
            titleElement.appendChild(containerDiv);
        }, 2000); // Start title animation after football animation completes
    </script>
</body>
</html>
