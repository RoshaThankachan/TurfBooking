<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link href="{{ url_for('static', filename='css/tweather.css') }}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
   
</head>
<body>
    <div class="dashboard-container">
        <div class="navbar">
            <div class="logo">TurfBooking</div>
            <div class="actions">
                <div class="notification">
                    <i class="fas fa-bell"></i>
                    <div class="badge">3</div>
                </div>
                <div class="profile">
                    <img src="{{ url_for('static', filename='images/adm.png') }}" alt="Admin Profile" class="logo-img">
                    <div class="name">{{ owner.owner_fname }} {{ owner.owner_lname }}</div>
                </div>
               
            </div>
        </div>
        
        <aside class="sidebar">
            <ul class="sidebar-nav">
                <li><a href="/owner/dashboard"><i class="fas fa-home"></i>Dashboard</a></li>
                <li><a href="/owner/register_turf"><i class="fas fa-plus-circle"></i>Register Turf</a></li>
                <li><a href="/owner/view_turfs"><i class="fas fa-list"></i>View Turfs</a></li>
                <li><a href="/owner/bookings"><i class="fas fa-calendar-alt"></i>Bookings</a></li>
                <li><a href="/owner/revenue"><i class="fas fa-chart-line"></i>Revenue</a></li>
                <li><a href="/owner/messages"><i class="fas fa-envelope"></i>Messages</a></li>
                <li><a href="/owner/tprofile"><i class="fas fa-user"></i>Profile</a></li>
                <li><a href="/owner/promotions"><i class="fas fa-tags"></i>Promotions</a></li>
                <li><a href="/owner/inventory"><i class="fas fa-boxes"></i>Inventory</a></li>
                <li><a href="/owner/weather"><i class="fas fa-cloud-sun"></i>Weather</a></li>
                <li><a href="/owner/reviews"><i class="fas fa-star"></i>Reviews</a></li>
                <li><a href="/logout"><i class="fas fa-sign-out-alt"></i>Logout</a></li>
            </ul>
        </aside>


        <main class="main-content">
            <header class="header">
                
            </header>

            <div class="container">
                <div class="weather-card">
                    <h2>Current Weather</h2>
                    <div class="location"></div>
                    <div class="current-weather">
                        <div class="temperature">
                            <span id="current-temp">--</span>°C
                        </div>
                        <div class="weather-info">
                            <div id="current-desc">Loading...</div>
                        </div>
                    </div>
                    <div class="weather-stats">
                        <div class="stat">
                            <div class="stat-label">Humidity</div>
                            <div class="stat-value"><span id="humidity">--</span>%</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Wind</div>
                            <div class="stat-value"><span id="wind">--</span> km/h</div>
                        </div>
                    </div>
                </div>

                <div class="weather-card">
                    <h2>5-Day Forecast</h2>
                    <div class="forecast" id="forecast">
                        <!-- Forecast items will be inserted here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_KEY = '7518f083889ee756b6449e9f1d52fe75';
        const CITY = 'Kottayam,IN';

        // Fetch current weather
        fetch(`https://api.openweathermap.org/data/2.5/weather?q=${CITY}&units=metric&appid=${API_KEY}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('current-temp').textContent = Math.round(data.main.temp);
                document.getElementById('current-desc').textContent = data.weather[0].description;
                document.getElementById('humidity').textContent = data.main.humidity;
                document.getElementById('wind').textContent = Math.round(data.wind.speed * 3.6);
            })
            .catch(error => console.error('Error fetching current weather:', error));

        // Fetch 5-day forecast
        fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${CITY}&units=metric&appid=${API_KEY}`)
            .then(response => response.json())
            .then(data => {
                const forecastContainer = document.getElementById('forecast');
                const dailyData = data.list.filter(reading => reading.dt_txt.includes('12:00:00'));
                
                dailyData.slice(0, 4).forEach(day => {
                    const date = new Date(day.dt * 1000);
                    const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    
                    const forecastDay = document.createElement('div');
                    forecastDay.className = 'forecast-day';
                    forecastDay.innerHTML = `
                        <div class="forecast-date">${dayNames[date.getDay()]}, ${monthNames[date.getMonth()]} ${date.getDate()}</div>
                        <div class="forecast-temp">${Math.round(day.main.temp)}°C</div>
                        <div class="forecast-desc">${day.weather[0].description}</div>
                    `;
                    forecastContainer.appendChild(forecastDay);
                });
            })
            .catch(error => console.error('Error fetching forecast:', error));
    </script>
</body>
</html>
